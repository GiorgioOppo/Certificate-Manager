name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential pkg-config libssl-dev libsqlite3-dev libcurl4-openssl-dev openssl python3
      - name: Check interface JavaScript
        run: |
          node --check web/app.js
          node --check web/extensions.js
          node --check web/operations-ui.js
          node --check web/incidents-ui.js
      - name: Build and run tests
        run: make test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build container image
        run: docker compose build --pull
      - name: Verify container and persistent data
        run: python3 tests/container_smoke.py
